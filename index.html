<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务受理情况 · 实时协作版</title>
    <!-- business-icons + auto-constructed-for-internet-line: 2026-07-06 -->
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');

        :root {
            --bg: #f6f8fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #64748b;
            --border: #e5e7eb;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Inter", "Microsoft YaHei", system-ui, sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(59, 130, 246, 0.08), transparent 28%),
                radial-gradient(circle at 88% 0%, rgba(34, 197, 94, 0.07), transparent 26%),
                var(--bg);
            color: var(--text);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .title {
            font-family: "Space Grotesk", system-ui, sans-serif;
            font-size: 34px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -2px;
        }

        .room-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.92);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        .room-control input {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #111827;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 14px;
            width: 220px;
            outline: none;
        }
        .room-control input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            background: #2563eb;
            color: white;
            border: 1px solid #1d4ed8;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, filter 0.2s ease;
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.18);
        }
        button:hover {
            background: #1d4ed8;
            border-color: #1e40af;
        }

        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
        }
        .stat .value {
            font-family: "Space Grotesk", ui-monospace, monospace;
            font-size: 23px;
            font-weight: 700;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(355px, 1fr));
            gap: 18px;
        }

        .task-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            /* 鼠标悬停时不再位移，避免卡片抖动 */
            transition: border-color 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease, opacity 0.25s ease;
            will-change: box-shadow;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
        }
        .task-card:hover {
            /* 保持稳定，不做 translateY 位移 */
            transform: none;
        }
        .task-card.normal {
            border-color: rgba(34, 197, 94, 0.75);
        }
        .task-card.warning {
            border-color: #ff9f1c;
            box-shadow: 0 0 16px rgba(255, 159, 28, 0.12);
        }
        .task-card.urgent {
            border-color: #ff3b5c;
            animation: urgentBreath 1.35s ease-in-out infinite;
        }
        .task-card.completed {
            border-color: #6b7280;
            opacity: 0.74;
            filter: grayscale(0.25);
        }

        @keyframes urgentBreath {
            0%, 100% {
                box-shadow: 0 0 0 rgba(255, 59, 92, 0.12), 0 0 8px rgba(255, 59, 92, 0.22);
            }
            50% {
                box-shadow: 0 0 22px rgba(255, 59, 92, 0.55), 0 0 44px rgba(255, 59, 92, 0.28);
            }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 14px;
        }
        .task-title-wrap {
            min-width: 0;
            flex: 1;
        }
        .task-name {
            font-size: 16.5px;
            font-weight: 600;
            line-height: 1.3;
            color: #0f172a;
            word-break: break-word;
        }
        .business-type-row {
            margin-top: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .biz-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px 6px 8px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
        }
        .biz-icon {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
            flex-shrink: 0;
        }
        .biz-new {
            background: #dbeafe;
            color: #1d4ed8;
            border-color: #93c5fd;
        }
        .biz-new .biz-icon {
            background: #2563eb;
            color: #ffffff;
        }
        .biz-change {
            background: #f3e8ff;
            color: #7c3aed;
            border-color: #c4b5fd;
        }
        .biz-change .biz-icon {
            background: #8b5cf6;
            color: #ffffff;
        }
        .biz-gov {
            background: #dcfce7;
            color: #166534;
            border-color: #86efac;
        }
        .biz-gov .biz-icon {
            background: #16a34a;
            color: #ffffff;
        }
        .biz-ethernet {
            background: #ffedd5;
            color: #c2410c;
            border-color: #fdba74;
        }
        .biz-ethernet .biz-icon {
            background: #ea580c;
            color: #ffffff;
        }
        .biz-generic {
            background: #e2e8f0;
            color: #334155;
            border-color: #cbd5e1;
        }
        .biz-generic .biz-icon {
            background: #64748b;
            color: #ffffff;
        }
        .status-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }
        .status-pill.green { background: #dcfce7; color: #166534; }
        .status-pill.orange { background: #ffedd5; color: #9a3412; }
        .status-pill.red { background: #fee2e2; color: #991b1b; }
        .status-pill.gray { background: #f3f4f6; color: #4b5563; }

        .main-row {
            display: flex;
            gap: 18px;
            align-items: center;
            margin-bottom: 16px;
        }

        .countdown {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
        }
        .digit {
            font-family: "Space Grotesk", ui-monospace, monospace;
            font-size: 24px;
            font-weight: 700;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9px;
            padding: 9px 5px 5px;
            color: #111827;
            text-align: center;
        }
        .digit-label {
            font-size: 8.5px;
            color: #555;
            margin-top: 3px;
            text-align: center;
            letter-spacing: 1.5px;
        }

        .circular-progress {
            width: 82px;
            height: 82px;
            flex-shrink: 0;
            position: relative;
        }
        .circular-progress svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        .circular-progress .track {
            fill: none;
            stroke: #e5e7eb;
            stroke-width: 8;
        }
        .circular-progress .progress {
            fill: none;
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }
        /* 进度条颜色强制跟随状态，避免旧样式或浏览器缓存导致看起来未变化 */
        .task-card.normal .circular-progress .progress { stroke: #22c55e !important; }
        .task-card.warning .circular-progress .progress { stroke: #ff9f1c !important; }
        .task-card.urgent .circular-progress .progress { stroke: #ff3b5c !important; }
        .task-card.completed .circular-progress .progress { stroke: #9ca3af !important; }
        .task-card.normal .pct { color: #22c55e !important; }
        .task-card.warning .pct { color: #ff9f1c !important; }
        .task-card.urgent .pct { color: #ff3b5c !important; }
        .task-card.completed .pct { color: #9ca3af !important; }
        .circular-progress .center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .circular-progress .pct {
            font-family: "Space Grotesk", ui-monospace, monospace;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
        }

        .action-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e5e7eb;
        }
        .action-item {
            min-width: 0;
        }
        .action-label {
            font-size: 11.5px;
            color: #64748b;
            margin-bottom: 5px;
            display: block;
        }
        .toggle-btn {
            width: 100%;
            padding: 9px 0;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            color: white;
            transition: filter 0.2s ease, opacity 0.2s ease;
            box-shadow: none;
        }
        .toggle-btn.red { background: #ef4444; }
        .toggle-btn.green { background: #22c55e; }
        .toggle-btn:hover { filter: brightness(1.1); }

        .meta {
            margin-top: 12px;
            font-size: 12px;
            color: #5f6470;
            display: flex;
            justify-content: space-between;
        }

        .connected {
            color: #22c55e;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1 class="title">业务受理情况</h1>
                <div style="color:#64748b; font-size:13px;">实时协作版 · 多人同步</div>
            </div>

            <div class="room-control">
                <span style="color:#64748b; font-size:13px;">房间ID：</span>
                <input type="text" id="roomId" value="默认项目-2026" placeholder="群里所有人用同一个ID">
                <button onclick="connectToRoom()" style="padding:8px 16px; font-size:13px;">连接房间</button>
            </div>
        </div>

        <div class="stats" id="stats-bar" style="display:none;">
            <div class="stat">
                <span>总任务</span> 
                <span class="value" id="stat-total">0</span>
            </div>
            <div class="stat urgent">
                <span>紧急任务</span> 
                <span class="value" id="stat-urgent">0</span>
            </div>
            <div class="stat min-time">
                <span>最少剩余时间（小时）</span> 
                <span class="value" id="stat-min-hours">-</span>
            </div>
        </div>

       <div style="margin-bottom:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
    <button onclick="selectFile()">📁 上传 Excel</button>
    <button onclick="refreshFromSavedFile()" style="background:#0f172a; border-color:#0f172a; box-shadow:0 6px 16px rgba(15,23,42,0.12);">⟳ 刷新数据</button>
    <span style="color:#64748b; font-size:13px;">提示：可修改房间ID，输入相同房间ID的电脑会实时同步</span>
</div>

        <div id="cards-container" class="cards-grid"></div>
    </div>

    <canvas id="bg-particles" style="position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.18;"></canvas>

    <script>
        // ==================== Firebase 配置 ====================
       const firebaseConfig = {
  apiKey: "AIzaSyAduMWdqKBEkn5cFL0YwfmTlf77mgwH1Cg",
  authDomain: "yewushouli-f4d6e.firebaseapp.com",
  databaseURL: "https://yewushouli-f4d6e-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "yewushouli-f4d6e",
  storageBucket: "yewushouli-f4d6e.firebasestorage.app",
  messagingSenderId: "713365140691",
  appId: "1:713365140691:web:e458f38b23d7a3b1129026"
};

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const DEFAULT_ROOM_ID = '默认项目-2026';
        let currentRoomId = "";
        let countdownData = [];
        let savedFileHandle = null;
        let firebaseListeners = {};
        let firebaseConnected = false;
        let activeReadTimer = null;

        // 同步状态提示已隐藏：保留日志，避免页面显示橙色“状态”文字
        function setSyncStatus(message, type = 'info') {
            if (message) {
                const level = type === 'error' ? 'error' : (type === 'ok' ? 'log' : 'info');
                console[level](message);
            }
        }

        function withTimeout(promise, ms, message) {
            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => reject(new Error(message || `操作超时：${ms}ms`)), ms);
                Promise.resolve(promise).then(
                    value => { clearTimeout(timer); resolve(value); },
                    err => { clearTimeout(timer); reject(err); }
                );
            });
        }

        function watchFirebaseConnection() {
            const infoRef = database.ref('.info/connected');
            const callback = (snapshot) => {
                // 只在内部记录 Firebase 连接状态，不在页面右上角显示任何提示文字
                firebaseConnected = snapshot.val() === true;
            };
            infoRef.on('value', callback);
            firebaseListeners['connection'] = { ref: infoRef, event: 'value', callback };
        }

        // ==================== 背景粒子 ====================
        const canvas = document.getElementById('bg-particles');
        const ctx = canvas.getContext('2d', { alpha: true });
        let particles = [];
        let mouse = { x: null, y: null };

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.4 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.28;
                this.speedY = (Math.random() - 0.5) * 0.28;
                this.alpha = Math.random() * 0.3 + 0.15;
            }
            update() {
                if (mouse.x !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 90) {
                        const f = (90 - dist) / 90;
                        this.speedX += (dx / dist) * f * 0.25;
                        this.speedY += (dy / dist) * f * 0.25;
                    }
                }
                this.x += this.speedX; this.y += this.speedY;
                this.speedX *= 0.985; this.speedY *= 0.985;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#94a3b8';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function initParticles(n = 55) { particles = []; for (let i = 0; i < n; i++) particles.push(new Particle()); }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) { p.update(); p.draw(); }
            requestAnimationFrame(animate);
        }
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        initParticles();
        animate();

        // ==================== 房间 / Firebase 同步 ====================
        function normalizeBusinessType(typeText = '') {
            const text = String(typeText || '').replace(/[（）()]/g, '').trim();
            if (!text) return '';
            if (text.includes('互联网专线新开')) return '互联网专线新开';
            if (text.includes('互联网专线变更')) return '互联网专线变更';
            if (text.includes('政企精品网')) return '政企精品网';
            if (text.includes('以太网')) return '以太网';
            return text;
        }

        function extractBusinessType(name = '', fallback = '') {
            const text = String(name || '');
            const matched = text.match(/[（(]([^（）()]+)[）)]/g) || [];
            for (const seg of matched) {
                const normalized = normalizeBusinessType(seg);
                if (normalized) return normalized;
            }
            return normalizeBusinessType(fallback);
        }

        function getBusinessTypeMeta(typeText = '') {
            const type = normalizeBusinessType(typeText);
            if (type === '互联网专线新开') {
                return { label: '互联网专线新开', icon: '新', cls: 'biz-new' };
            }
            if (type === '互联网专线变更') {
                return { label: '互联网专线变更', icon: '变', cls: 'biz-change' };
            }
            if (type === '政企精品网') {
                return { label: '政企精品网', icon: '政', cls: 'biz-gov' };
            }
            if (type === '以太网') {
                return { label: '以太网', icon: '以', cls: 'biz-ethernet' };
            }
            if (type) {
                return { label: type, icon: '业', cls: 'biz-generic' };
            }
            return null;
        }

        function isInternetLineBusiness(typeOrItem = '') {
            const raw = (typeof typeOrItem === 'object')
                ? `${typeOrItem.businessType || ''} ${typeOrItem.name || ''}`
                : String(typeOrItem || '');
            const type = normalizeBusinessType(raw);
            return type === '互联网专线新开' || type === '互联网专线变更'
                || raw.includes('互联网专线新开') || raw.includes('互联网专线变更');
        }

        function cleanTaskName(name = '', typeText = '') {
            let title = String(name || '').trim();
            const type = normalizeBusinessType(typeText) || extractBusinessType(title);
            if (type) {
                const escaped = type.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                title = title
                    .replace(new RegExp(`\\s*[（(]${escaped}[）)]\\s*`, 'g'), ' ')
                    .replace(/\s{2,}/g, ' ')
                    .trim();
            }
            return title;
        }

        function getRoomInputValue() {
            const input = document.getElementById('roomId');
            return (input && input.value.trim()) ? input.value.trim() : DEFAULT_ROOM_ID;
        }

        function validateRoomId(roomId) {
            // Firebase Realtime Database 路径不能包含 . # $ [ ] /，房间ID尽量用中文、字母、数字、短横线
            return roomId && !/[.#$\[\]\/]/.test(roomId);
        }

        function updateRoomUrl(roomId) {
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('room', roomId);
                window.history.replaceState(null, '', url.toString());
            } catch (e) {}
        }

        function taskKey(name) {
            // Firebase Realtime Database 的 key 不能包含 . # $ [ ] /
            // 用 encodeURIComponent 后再处理英文句点，确保任务名称可作为安全 key
            return encodeURIComponent(String(name)).replace(/\./g, '%2E');
        }

        function calcRemainSeconds(item) {
            if (item.endAt) {
                return Math.max(0, Math.floor((Number(item.endAt) - Date.now()) / 1000));
            }
            return Math.max(0, Number(item.currentSeconds) || 0);
        }

        function normalizeTaskFromFirebase(fbTask) {
            const initialSeconds = Number(fbTask.initialSeconds) || 0;
            const businessType = normalizeBusinessType(fbTask.businessType || extractBusinessType(fbTask.name || ''));
            const item = {
                name: fbTask.name || '未命名任务',
                businessType,
                acceptSerial: fbTask.acceptSerial || '',
                initialSeconds,
                endAt: Number(fbTask.endAt) || (Date.now() + initialSeconds * 1000),
                currentSeconds: 0,
                orderTaken: fbTask.orderTaken || 'red',
                completed: fbTask.completed || 'red',
                constructed: isInternetLineBusiness(businessType || fbTask.name) ? 'green' : (fbTask.constructed || 'red')
            };
            item.currentSeconds = calcRemainSeconds(item);
            return item;
        }

        function getCurrentRoomTasksRef() {
            if (!currentRoomId) return null;
            return database.ref(`rooms/${currentRoomId}/tasks`);
        }

        // ==================== 连接房间 ====================
        function connectToRoom() {
            const roomInput = getRoomInputValue();
            const inputEl = document.getElementById('roomId');

            if (!validateRoomId(roomInput)) {
                alert('房间ID不能包含这些字符：. # $ [ ] /');
                return false;
            }

            if (inputEl) inputEl.value = roomInput;

            // 断开之前的监听
            Object.values(firebaseListeners).forEach(listenerInfo => {
                if (listenerInfo && listenerInfo.ref && listenerInfo.callback) {
                    listenerInfo.ref.off(listenerInfo.event, listenerInfo.callback);
                }
            });
            firebaseListeners = {};

            // 切换房间时先清空当前卡片，避免误以为还在旧房间
            if (currentRoomId && currentRoomId !== roomInput) {
                countdownData = [];
                renderCards();
                document.querySelector('.stats').style.display = 'none';
            }

            currentRoomId = roomInput;
            try { localStorage.setItem('businessRoomId', currentRoomId); } catch (e) {}
            updateRoomUrl(currentRoomId);
            setSyncStatus('状态：正在连接 Firebase，并读取房间 ' + currentRoomId + ' 的任务数据...', 'info');
            watchFirebaseConnection();

            // 重点：即使当前浏览器没有上传 Excel，也要监听 Firebase，直接从房间读取任务列表
            listenToAllTasks();
            return true;
        }

        function ensureConnectedToInputRoom() {
            const roomInput = getRoomInputValue();
            if (!currentRoomId || currentRoomId !== roomInput) {
                return connectToRoom();
            }
            return true;
        }

        // ==================== 监听 Firebase 变化 ====================
        function listenToAllTasks() {
            if (!currentRoomId) return;

            // 防止重复绑定 Firebase 监听
            if (firebaseListeners['allTasks']) {
                const old = firebaseListeners['allTasks'];
                old.ref.off(old.event, old.callback);
                delete firebaseListeners['allTasks'];
            }

            const tasksRef = getCurrentRoomTasksRef();
            if (!tasksRef) return;

            const callback = (snapshot) => {
                if (activeReadTimer) {
                    clearTimeout(activeReadTimer);
                    activeReadTimer = null;
                }
                const firebaseData = snapshot.val() || {};
                const list = Object.values(firebaseData).map(normalizeTaskFromFirebase);

                countdownData = list.sort((a,b) => a.currentSeconds - b.currentSeconds);
                renderCards();

                if (countdownData.length) {
                    document.querySelector('.stats').style.display = 'flex';
                    setSyncStatus('状态：已从 Firebase 读取 ' + countdownData.length + ' 条任务。其他电脑输入同一房间ID即可同步。', 'ok');
                } else {
                    document.querySelector('.stats').style.display = 'none';
                    setSyncStatus('状态：房间 ' + currentRoomId + ' 暂无任务。请先在任意一台电脑使用该房间ID上传 Excel。', 'info');
                }
            };

            activeReadTimer = setTimeout(() => {
                setSyncStatus('状态：Firebase 读取超过 10 秒没有返回。请检查：① databaseURL 是否是 Realtime Database 数据页顶部地址；② 数据库规则是否允许 read/write；③ Firebase 控制台是否已经创建 Realtime Database；④ 当前网络是否能访问 Firebase。', 'error');
            }, 10000);

            tasksRef.on('value', callback, (error) => {
                if (activeReadTimer) {
                    clearTimeout(activeReadTimer);
                    activeReadTimer = null;
                }
                console.error('读取 Firebase 失败:', error);
                setSyncStatus('状态：读取 Firebase 失败：' + error.message + '\n请检查 Firebase 配置和 Realtime Database 读写规则。', 'error');
                alert('读取 Firebase 失败：' + error.message + '\n请检查 Firebase 配置和 Realtime Database 读写规则。');
            });

            firebaseListeners['allTasks'] = { ref: tasksRef, event: 'value', callback };
        }

        async function publishTasksToFirebase(tasks, fileName = '') {
            if (!currentRoomId) return;

            const tasksRef = getCurrentRoomTasksRef();
            if (!tasksRef) return;

            setSyncStatus('状态：Excel 已解析 ' + tasks.length + ' 条任务，正在连接 Firebase 并上传...', 'info');

            // 读取旧状态，避免重新上传 Excel 后“已接单/已完成”状态被清空。读取不成功不阻塞上传。
            let oldData = {};
            try {
                const snap = await withTimeout(tasksRef.once('value'), 8000, '读取旧任务状态超时');
                oldData = snap.val() || {};
            } catch (err) {
                console.warn('读取旧任务状态失败，将按本地状态上传:', err);
                setSyncStatus('状态：旧状态读取失败，继续尝试上传 Excel 数据。原因：' + err.message, 'info');
            }

            const now = Date.now();
            const payload = {};

            tasks.forEach(item => {
                const key = taskKey(item.name);
                const oldTask = oldData[key] || {};
                const initialSeconds = Number(item.initialSeconds) || Number(item.currentSeconds) || 0;

                payload[key] = {
                    name: item.name,
                    businessType: normalizeBusinessType(item.businessType || extractBusinessType(item.name || '')),
                    acceptSerial: item.acceptSerial || '',
                    initialSeconds,
                    // 用统一截止时间同步倒计时，其他浏览器不用上传 Excel 也能显示准确剩余时间
                    endAt: now + initialSeconds * 1000,
                    orderTaken: item.orderTaken || oldTask.orderTaken || 'red',
                    completed: item.completed || oldTask.completed || 'red',
                    constructed: isInternetLineBusiness(item.businessType || item.name) ? 'green' : (item.constructed || oldTask.constructed || 'red'),
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                };
            });

            try {
                await withTimeout(tasksRef.set(payload), 12000, '上传任务到 Firebase 超时');
                await withTimeout(database.ref(`rooms/${currentRoomId}/meta`).update({
                    lastExcelFileName: fileName || '',
                    lastExcelUploadedAt: firebase.database.ServerValue.TIMESTAMP
                }), 8000, '更新房间信息超时');
                setSyncStatus('状态：已上传并同步 ' + tasks.length + ' 条任务到 Firebase。请在其他电脑输入同一房间ID：' + currentRoomId, 'ok');
            } catch (err) {
                console.error('上传 Firebase 失败:', err);
                setSyncStatus('状态：上传 Firebase 失败：' + err.message + '\n请重点检查 databaseURL、Realtime Database 是否创建、Rules 是否允许写入。', 'error');
                throw err;
            }
        }

        // 更新单个任务状态到 Firebase
        function updateTaskInFirebase(taskName, field, value) {
            if (!currentRoomId) {
                alert("请先连接房间！");
                return;
            }
            const taskRef = database.ref(`rooms/${currentRoomId}/tasks/${taskKey(taskName)}`);
            taskRef.update({
                [field]: value,
                lastUpdated: firebase.database.ServerValue.TIMESTAMP
            }).catch(err => {
                console.error("写入 Firebase 失败:", err);
                alert('写入 Firebase 失败：' + err.message + '\n请检查 Firebase 配置和 Realtime Database 写入规则。');
            });
        }

        // ==================== Excel 加载 ====================
        async function selectFile() {
            try {
                // 上传前始终以输入框里的房间ID为准，避免用户改了房间ID但数据仍写入旧房间
                if (!ensureConnectedToInputRoom()) return;

                const [h] = await window.showOpenFilePicker({ 
                    types: [{description:'Excel', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}] 
                });
                savedFileHandle = h;
                const f = await savedFileHandle.getFile();
                await loadExcel(f);
            } catch(e){
                console.warn('用户取消选择文件、文件读取失败或 Firebase 上传失败:', e);
                if (e && e.name !== 'AbortError') {
                    setSyncStatus('状态：上传流程失败：' + (e.message || e), 'error');
                }
            }
        }

        async function ensureFileReadPermission(fileHandle) {
            if (!fileHandle.queryPermission || !fileHandle.requestPermission) return true;
            const options = { mode: 'read' };
            if (await fileHandle.queryPermission(options) === 'granted') return true;
            return await fileHandle.requestPermission(options) === 'granted';
        }

        async function refreshFromSavedFile() {
            try {
                // 刷新前也以输入框里的房间ID为准
                if (!ensureConnectedToInputRoom()) return;

                if (!savedFileHandle) {
                    alert('请先点击“上传 Excel”选择一次文件，然后再点击“刷新数据”。\n说明：另一个浏览器只需要连接房间，不需要上传 Excel。');
                    return;
                }

                const hasPermission = await ensureFileReadPermission(savedFileHandle);
                if (!hasPermission) {
                    alert('没有读取文件权限，请重新上传 Excel 文件。');
                    return;
                }

                const f = await savedFileHandle.getFile();
                await loadExcel(f);
            } catch (e) {
                console.error('刷新 Excel 失败:', e);
                alert('刷新失败，请重新点击“上传 Excel”选择文件。');
            }
        }

        async function loadExcel(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = async e => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, {type:'array'});
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(ws, {header:1});

                        const newData = [];
                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (row[0] && row[2]) {
                                const rawName = String(row[0]).trim();
                                const secs = parseChineseDuration(String(row[2]).trim());
                                const businessType = extractBusinessType(rawName, row[4] || '');
                                newData.push({
                                    name: rawName,
                                    businessType,
                                    acceptSerial: row[1] || '',
                                    initialSeconds: secs,
                                    endAt: Date.now() + secs * 1000,
                                    currentSeconds: secs,
                                    orderTaken: 'red',
                                    completed: 'red',
                                    constructed: isInternetLineBusiness(businessType || rawName) ? 'green' : 'red'
                                });
                            }
                        }

                        // 保留本机已有状态，之后 publishTasksToFirebase 还会再保留 Firebase 里的旧状态
                        const mergedData = newData.map(newItem => {
                            const existing = countdownData.find(old => old.name === newItem.name);
                            if (existing) {
                                return {
                                    ...newItem,
                                    businessType: newItem.businessType || existing.businessType || extractBusinessType(newItem.name || existing.name || ''),
                                    orderTaken: existing.orderTaken || 'red',
                                    completed: existing.completed || 'red',
                                    constructed: isInternetLineBusiness(newItem.businessType || newItem.name) ? 'green' : (existing.constructed || 'red')
                                };
                            }
                            return newItem;
                        });

                        countdownData = mergedData.sort((a,b) => a.currentSeconds - b.currentSeconds);
                        renderCards();
                        document.querySelector('.stats').style.display = countdownData.length ? 'flex' : 'none';

                        if (!ensureConnectedToInputRoom()) return;

                        // 重点：上传/刷新 Excel 后，把完整任务列表写入 Firebase
                        // 其他浏览器只要连接同一个房间，就能直接看到数据
                        await publishTasksToFirebase(countdownData, file && file.name ? file.name : '');
                        resolve();
                    } catch(err) {
                        alert('解析失败: ' + err.message);
                        reject(err);
                    }
                };
                r.onerror = () => {
                    alert('读取文件失败');
                    reject(r.error);
                };
                r.readAsArrayBuffer(file);
            });
        }

        function parseChineseDuration(str) {
            if (!str) return 0;
            let t = 0;
            const d = str.match(/(\d+)\s*天/); if (d) t += +d[1]*86400;
            const h = str.match(/(\d+)\s*(小时|时)/); if (h) t += +h[1]*3600;
            const m = str.match(/(\d+)\s*(分钟|分)/); if (m) t += +m[1]*60;
            const s = str.match(/(\d+)\s*秒/); if (s) t += +s[1];
            return t;
        }

        function getStatus(sec) {
            // 颜色规则：已结束灰色；剩余 ≥2天绿色；剩余 1~2天橙色；剩余 <1天红色
            if (sec <= 0) return {label:'已结束', cls:'gray', color:'#9ca3af'};
            const d = sec / 86400;
            if (d >= 2) return {label:'正常', cls:'green', color:'#22c55e'};
            if (d >= 1) return {label:'警告', cls:'orange', color:'#ff9f1c'};
            return {label:'紧急', cls:'red', color:'#ff3b5c'};
        }

        function getActionText(field, value) {
            if (field === 'orderTaken') return value === 'green' ? '已接单' : '未接单';
            if (field === 'completed') return value === 'green' ? '已完成' : '未完成';
            if (field === 'constructed') return value === 'green' ? '已施工完毕' : '未施工';
            return value === 'green' ? '已完成' : '未完成';
        }

        function toggleStatus(index, field, btn) {
            const item = countdownData[index];

            // 互联网专线业务（新开/变更）默认视为已施工完毕，施工按钮保持绿色，不允许被误点回红色。
            if (field === 'constructed' && isInternetLineBusiness(item.businessType || item.name)) {
                item.constructed = 'green';
                btn.classList.remove('red', 'green');
                btn.classList.add('green');
                btn.textContent = getActionText('constructed', 'green');
                updateTaskInFirebase(item.name, 'constructed', 'green');
                return;
            }

            const currentValue = item[field] || 'red';
            const newValue = currentValue === 'red' ? 'green' : 'red';

            item[field] = newValue;

            btn.classList.remove('red', 'green');
            btn.classList.add(newValue);
            btn.textContent = getActionText(field, newValue);

            // 同步到 Firebase
            updateTaskInFirebase(item.name, field, newValue);
        }

        function createCard(item, idx) {
            const st = getStatus(item.currentSeconds);
            const days = item.currentSeconds / 86400;
            const businessMeta = getBusinessTypeMeta(item.businessType || extractBusinessType(item.name || ''));
            const displayName = cleanTaskName(item.name || '', item.businessType || '');
            const constructedValue = isInternetLineBusiness(item.businessType || item.name) ? 'green' : (item.constructed || 'red');

            let cls = 'task-card';
            if (item.currentSeconds <= 0) cls += ' completed';
            else if (days < 1) cls += ' urgent';
            else if (days < 2) cls += ' warning';
            else cls += ' normal';

            const d = Math.floor(item.currentSeconds / 86400);
            const h = Math.floor((item.currentSeconds % 86400) / 3600);
            const m = Math.floor((item.currentSeconds % 3600) / 60);
            const s = Math.floor(item.currentSeconds % 60);

            // 进度条比例：3天=100%，0时0分0秒=0%
            const MAX_PROGRESS_SECONDS = 3 * 86400;
            let pct = Math.max(0, Math.min(100, (item.currentSeconds / MAX_PROGRESS_SECONDS) * 100));

            const circumference = 2 * Math.PI * 41;
            const dashoffset = circumference * (1 - pct / 100);
            const trackColor = item.currentSeconds <= 0 ? '#cbd5e1' : '#e5e7eb';

            const acc = item.acceptSerial ? formatExcelDate(item.acceptSerial) : '—';

            return `
                <div class="${cls}" data-index="${idx}">
                    <div class="card-header">
                        <div class="task-title-wrap">
                            <div class="task-name">${displayName}</div>
                            ${businessMeta ? `
                            <div class="business-type-row">
                                <div class="biz-badge ${businessMeta.cls}">
                                    <span class="biz-icon">${businessMeta.icon}</span>
                                    <span>${businessMeta.label}</span>
                                </div>
                            </div>` : ''}
                        </div>
                        <div class="status-pill ${st.cls}">${st.label}</div>
                    </div>

                    <div class="main-row">
                        <div class="countdown">
                            <div class="digit-group">
                                <div class="digit">${String(d).padStart(2,'0')}</div>
                                <div class="digit-label">天</div>
                            </div>
                            <div class="digit-group">
                                <div class="digit">${String(h).padStart(2,'0')}</div>
                                <div class="digit-label">时</div>
                            </div>
                            <div class="digit-group">
                                <div class="digit">${String(m).padStart(2,'0')}</div>
                                <div class="digit-label">分</div>
                            </div>
                            <div class="digit-group">
                                <div class="digit">${String(s).padStart(2,'0')}</div>
                                <div class="digit-label">秒</div>
                            </div>
                        </div>

                        <div class="circular-progress">
                            <svg viewBox="0 0 100 100">
                                <circle class="track" cx="50" cy="50" r="41" stroke="${trackColor}"></circle>
                                <circle class="progress" cx="50" cy="50" r="41"
                                        stroke="${st.color}"
                                        style="stroke:${st.color} !important;"
                                        stroke-dasharray="${circumference}"
                                        stroke-dashoffset="${dashoffset}"></circle>
                            </svg>
                            <div class="center">
                                <div class="pct" style="color:${st.color} !important;">${Math.round(pct)}%</div>
                            </div>
                        </div>
                    </div>

                    <div class="action-row">
                        <div class="action-item">
                            <button class="toggle-btn ${constructedValue}" 
                                    onclick="toggleStatus(${idx}, 'constructed', this)">
                                ${getActionText('constructed', constructedValue)}
                            </button>
                        </div>
                        <div class="action-item">
                            <button class="toggle-btn ${item.orderTaken}" 
                                    onclick="toggleStatus(${idx}, 'orderTaken', this)">
                                ${getActionText('orderTaken', item.orderTaken)}
                            </button>
                        </div>
                        <div class="action-item">
                            <button class="toggle-btn ${item.completed}" 
                                    onclick="toggleStatus(${idx}, 'completed', this)">
                                ${getActionText('completed', item.completed)}
                            </button>
                        </div>
                    </div>

                    <div class="meta">
                        <span>受理 ${acc}</span>
                        <span style="color:${st.color}; font-weight:600;">剩余 ${d} 天</span>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const wrap = document.getElementById('cards-container');
            if (!countdownData.length) {
                wrap.innerHTML = `<div style="text-align:center; padding:70px 20px; color:#64748b; background:#ffffff; border:1px dashed #d1d5db; border-radius:16px;"><h3>暂无数据</h3><p>请上传 Excel 文件并连接房间</p></div>`;
                return;
            }
            wrap.innerHTML = countdownData.map((it, i) => createCard(it, i)).join('');
            updateStats();
        }

        function updateStats() {
            let t = 0, u = 0;
            let minSeconds = Infinity;

            countdownData.forEach(it => {
                if (it.currentSeconds > 0) {
                    t++;
                    const d = it.currentSeconds / 86400;
                    if (d < 1) u++;
                    if (it.currentSeconds < minSeconds) minSeconds = it.currentSeconds;
                }
            });

            document.getElementById('stat-total').textContent = t;
            document.getElementById('stat-urgent').textContent = u;

            const minHoursEl = document.getElementById('stat-min-hours');
            minHoursEl.textContent = (minSeconds === Infinity) ? '-' : Math.floor(minSeconds / 3600);
        }

        function updateAll() {
            if (!countdownData.length) return;
            countdownData.forEach(it => {
                it.currentSeconds = calcRemainSeconds(it);
            });
            countdownData.sort((a,b) => a.currentSeconds - b.currentSeconds);
            renderCards();
        }

        function formatExcelDate(serial) {
            if (!serial) return '—';
            const base = new Date(1899, 11, 30);
            const d = new Date(base.getTime() + serial * 86400000);
            return d.toLocaleString('zh-CN', {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false}).replace(/\//g, '-');
        }

        // 页面打开后自动连接：优先使用链接里的 ?room=房间ID，其次使用上次使用过的房间ID，最后使用默认房间
        window.addEventListener('DOMContentLoaded', () => {
            const roomInput = document.getElementById('roomId');
            if (!roomInput) return;

            try {
                const urlRoom = new URL(window.location.href).searchParams.get('room');
                const savedRoom = localStorage.getItem('businessRoomId');
                roomInput.value = urlRoom || savedRoom || roomInput.value.trim() || DEFAULT_ROOM_ID;
            } catch (e) {
                roomInput.value = roomInput.value.trim() || DEFAULT_ROOM_ID;
            }

            // 按 Enter 或输入框失焦后，可以快速切换房间
            roomInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') connectToRoom();
            });
            roomInput.addEventListener('change', () => {
                connectToRoom();
            });

            connectToRoom();
        });

        setInterval(updateAll, 1000);
    </script>
</body>
</html>
